name: Agent tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'uagents==0.26.1'
      - run: python -m unittest discover -s tests -v
      - name: Discovery outcome evals (fixtures, not ASI delivery)
        run: python evals/run.py --mode fixture
